<header class="header" [class.has-tournament]="!!tournamentName">
  <div class="header-left">
    <a class="home-link" href="https://bb-tournament.eu" title="Accueil BB-tournament.eu" aria-label="Accueil BB-tournament.eu">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
    <a class="site-brand" [class.site-brand-desktop-only]="!!tournamentName" href="https://bb-tournament.eu">🏈 BB-tournament.eu</a>
  </div>
  <a class="tournament-name" *ngIf="tournamentName" [routerLink]="brandLink">{{ tournamentName }}</a>
  <button type="button" class="info-btn" (click)="openInfo()" aria-label="À propos de ce site">❓</button>
</header>

<div class="info-drawer-backdrop" *ngIf="infoOpen" (click)="closeInfo()">
  <aside class="info-drawer" (click)="$event.stopPropagation()">
    <button type="button" class="btn info-drawer-close" (click)="closeInfo()">Fermer</button>
    <div class="markdown-body" [innerHTML]="infoHtml"></div>
  </aside>
</div>
